# Notes:
# - Coolify does not support rolling updates for compose deployments; every deploy
#   recreates containers, so expect a brief downtime window while healthchecks pass.
# - Set APP_DOMAIN in the deployment environment; Reverb (websockets) is expected to
#   run as a separate app on its own domain and is intentionally not part of this stack.

x-web-image: &web-image
  build:
    context: .
    dockerfile: Dockerfile
    target: web
    args:
      - VITE_APP_NAME=${VITE_APP_NAME}
      - VITE_REVERB_APP_KEY=${VITE_REVERB_APP_KEY}
      - VITE_REVERB_HOST=${VITE_REVERB_HOST}
      - VITE_REVERB_PORT=${VITE_REVERB_PORT}
      - VITE_REVERB_SCHEME=${VITE_REVERB_SCHEME}
  image: laravel-skeleton-web

x-worker-image: &worker-image
  build:
    context: .
    dockerfile: Dockerfile
    target: worker
  image: laravel-skeleton-worker

x-ssr-image: &ssr-image
  build:
    context: .
    dockerfile: Dockerfile
    target: ssr
    args:
      - VITE_APP_NAME=${VITE_APP_NAME}
      - VITE_REVERB_APP_KEY=${VITE_REVERB_APP_KEY}
      - VITE_REVERB_HOST=${VITE_REVERB_HOST}
      - VITE_REVERB_PORT=${VITE_REVERB_PORT}
      - VITE_REVERB_SCHEME=${VITE_REVERB_SCHEME}
  image: laravel-skeleton-ssr

x-app-volumes: &app-volumes
  volumes:
    - 'app-storage:/var/www/html/storage'
  tmpfs:
    - /tmp:noexec,nosuid,nodev,mode=1777

x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &logging
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '3'

x-app-env-file: &app-env-file
  env_file:
    - .env

x-docker-environment: &docker-environment
  NIGHTWATCH_INGEST_URI: 'nightwatch-agent:2409'
  AUTORUN_ENABLED: false
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}

x-restart-policy: &restart-policy
  restart: unless-stopped
  init: true

networks:
  # Internal traffic (app <-> ssr <-> nightwatch-agent) plus NAT egress.
  app-network:
    driver: bridge
  # Shared Coolify network: Traefik ingress and Coolify-managed Postgres/Redis.
  # Only services that need those join it.
  coolify:
    external: true

services:
  app:
    <<: [*web-image, *app-volumes, *security-opts, *logging, *app-env-file, *restart-policy]
    # frankenphp's binary has cap_net_bind_service=ep (effective bit), so execve
    # requires this cap to be grantable. *security-opts does cap_drop: ALL, so the
    # app service must add it back — without this, octane:start --server=frankenphp
    # fails with "exec: /usr/local/bin/frankenphp: Operation not permitted".
    cap_add:
      - NET_BIND_SERVICE
    environment:
      <<: *docker-environment
      AUTORUN_ENABLED: true
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: true
      INERTIA_SSR_ENABLED: true
      INERTIA_SSR_URL: "http://ssr:13714"
    command:
      [
        'php', 'artisan', 'octane:start',
        '--server=frankenphp',
        '--port=8080',
        '--max-requests=500',
        '--workers=4',
      ]
    deploy:
      replicas: ${APP_REPLICAS:-1}
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 256M
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=coolify'
      # Router config
      - 'traefik.http.routers.app.rule=Host(`${APP_DOMAIN}`)'
      - 'traefik.http.routers.app.entrypoints=https'
      - 'traefik.http.routers.app.tls=true'
      - 'traefik.http.routers.app.tls.certresolver=letsencrypt'
      # HTTP -> HTTPS redirect
      - 'traefik.http.routers.app-http.rule=Host(`${APP_DOMAIN}`)'
      - 'traefik.http.routers.app-http.entrypoints=http'
      - 'traefik.http.routers.app-http.middlewares=app-redirect-https'
      - 'traefik.http.middlewares.app-redirect-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.app-redirect-https.redirectscheme.permanent=true'
      # Load balancer config
      - 'traefik.http.services.app.loadbalancer.server.port=8080'
      - 'traefik.http.services.app.loadbalancer.sticky.cookie=true'
      - 'traefik.http.services.app.loadbalancer.sticky.cookie.name=app_affinity'
      - 'traefik.http.services.app.loadbalancer.sticky.cookie.httponly=true'
      - 'traefik.http.services.app.loadbalancer.sticky.cookie.secure=true'
      - 'traefik.http.services.app.loadbalancer.sticky.cookie.samesite=lax'
      - 'traefik.http.services.app.loadbalancer.healthcheck.path=/up'
      - 'traefik.http.services.app.loadbalancer.healthcheck.interval=10s'
      # Middlewares
      - 'traefik.http.routers.app.middlewares=app-compress,app-headers'
      - 'traefik.http.middlewares.app-compress.compress=true'
      - 'traefik.http.middlewares.app-headers.headers.contenttypenosniff=true'
      - 'traefik.http.middlewares.app-headers.headers.framedeny=true'
      - 'traefik.http.middlewares.app-headers.headers.stsincludesubdomains=true'
      - 'traefik.http.middlewares.app-headers.headers.stsseconds=31536000'
      - 'traefik.http.middlewares.app-headers.headers.stspreload=true'
      - 'traefik.http.middlewares.app-headers.headers.referrerpolicy=strict-origin-when-cross-origin'
      - 'traefik.http.middlewares.app-headers.headers.permissionspolicy=camera=(), microphone=(), geolocation=()'
    healthcheck:
      test: ['CMD', 'healthcheck-octane']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - app-network
      - coolify
    depends_on:
      ssr:
        condition: service_healthy
        restart: true

  worker:
    <<: [*worker-image, *app-volumes, *security-opts, *logging, *app-env-file, *restart-policy]
    command:
      [
        'php', '/var/www/html/artisan', 'queue:work',
        '--queue=default',
        '--tries=3',
        '--timeout=1000',
        '--max-time=3600',
        '--memory=400',
        '--sleep=3',
      ]
    environment:
      <<: *docker-environment
    deploy:
      replicas: ${QUEUE_WORKERS:-1}
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD', 'healthcheck-queue']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - app-network
      - coolify

  scheduler:
    <<: [*worker-image, *app-volumes, *security-opts, *logging, *app-env-file, *restart-policy]
    command: ['php', '/var/www/html/artisan', 'schedule:work']
    environment:
      <<: *docker-environment
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    healthcheck:
      test: ['CMD', 'healthcheck-schedule']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    networks:
      - app-network
      - coolify

  ssr:
    <<: [*ssr-image, *app-volumes, *security-opts, *logging, *app-env-file, *restart-policy]
    command: ['php', '/var/www/html/artisan', 'inertia:start-ssr', '--runtime=bun']
    environment:
      <<: *docker-environment
    deploy:
      replicas: ${SSR_REPLICAS:-1}
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    healthcheck:
      test: ['CMD', 'bun', '-e', 'const r = await fetch("http://127.0.0.1:13714/health"); const b = await r.json(); process.exit(b.status === "OK" ? 0 : 1)']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s
    networks:
      - app-network

  nightwatch-agent:
    image: laravelphp/nightwatch-agent:v1
    <<: [*security-opts, *logging, *restart-policy]
    environment:
      NIGHTWATCH_INGEST_URI: '0.0.0.0:2409'
      NIGHTWATCH_TOKEN: '${NIGHTWATCH_TOKEN}'
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ['CMD-SHELL', 'php nightwatch-status']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - app-network

volumes:
  app-storage:
    driver: local
